{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NovaGear — premium gaming accessories for PC gamers, streamers, and setup enthusiasts.">
  <title>NovaGear — Premium Gaming Accessories</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/design-system.css' %}">
  <link rel="stylesheet" href="{% static 'css/components.css' %}">
  <link rel="stylesheet" href="{% static 'css/layout.css' %}">
  <link rel="stylesheet" href="{% static 'css/chrome.css' %}">
  {% block extra_css %}
  {% endblock %}

</head>
{% block extra_body %}
{% endblock %}


<!--  <div data-site-header></div>-->
<!--  Навигация-->
  {% include "partials/navbar.html" %}

<!--  Блок контента-->
  {% block content %}
  {% endblock %}

<!--  <div data-site-footer></div>-->
  <!--Подвал-->
  {% include "partials/footer.html" %}

  <!-- Toast notification -->
  <div class="toast" data-toast role="alert" aria-live="assertive" hidden>
    <span data-toast-message></span>
  </div>

  <script src="{% static 'js/products.js' %}"></script>
  <script src="{% static 'js/store.js' %}"></script>
  <script src="{% static 'js/ui.js' %}"></script>
  <script src="{% static 'js/layout.js' %}"></script>
  {% block extra_js %}
  {% endblock %}

</body>
</html>
