<div class="page-hero">
  <div class="container">
    <nav class="breadcrumb" aria-label="Breadcrumb">
        {% for item in breadcrumbs %}
          {% if not forloop.first %}
            <span class="breadcrumb__sep">/</span>
          {% endif %}
          {% if item.url %}
            <a href="{% url item.url %}">{{ item.name }}</a>
          {% else %}
            <span>{{ item.name }}</span>
          {% endif %}
        {% endfor %}
      </nav>
    <h1 class="page-hero__title">Gaming <span class="text-gradient">Catalog</span></h1>
    <p class="page-hero__desc">12+ curated products for your battle station. Filter by category, price, or rating.</p>
  </div>
</div>
